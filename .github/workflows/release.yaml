name: Release

# Publishing is deliberately hard to do by accident. Four things must all be
# true before anything reaches PyPI:
#
#   1. the commit is on main
#   2. the version in pyproject is one PyPI has never seen
#   3. the whole suite passes, and the built wheel installs and boots
#   4. a human approves the `pypi` environment in the Actions UI
#
# Miss any of them and the run stops. Push a README fix to main and it will
# reach step 2, notice the version is unchanged, and stop without failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never two releases at once, and never cancel one midway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE: flexi

jobs:
  guard:
    name: Is this a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.published.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Read the version from pyproject
        run: |
          version=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject says $version"

      - id: published
        name: Has PyPI seen it before?
        run: |
          version="${{ steps.version.outputs.version }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/${PACKAGE}/${version}/json")
          if [ "$code" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE} ${version} is already on PyPI. Nothing to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE} ${version} is new. Continuing to verification."
          fi

  verify:
    # The same file `ci.yaml` calls, so a release is verified by exactly what a
    # pull request is verified by. It used to be a narrower copy -- ubuntu only,
    # two interpreters, no timezone matrix -- which meant the run that published
    # was the least tested run in the repository.
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    uses: ./.github/workflows/verify.yaml

  artefact:
    name: The artefact is the version being released
    needs: [guard, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Verify already built it, installed it somewhere with no source tree and
      # booted it. All that is left is to check that what it built carries the
      # version the guard read out of pyproject.
      - name: The filenames carry that version
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          ls -1 dist/
          test -f "dist/${PACKAGE}-${VERSION}-py3-none-any.whl"
          test -f "dist/${PACKAGE}-${VERSION}.tar.gz"

  publish:
    name: Publish to PyPI
    needs: [guard, artefact]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # PyPI hands out a short-lived credential in exchange for this token, so
      # there is no long-lived secret in the environment to leak or rotate. The
      # trusted publisher on PyPI is matched on this repository, this workflow
      # file and the `pypi` environment below, so a workflow added on a branch
      # cannot mint one.
      id-token: write
    # The approval gate. This environment has a required reviewer, so the run
    # pauses here until somebody presses the button in the Actions UI, and it
    # is restricted to main so no other branch can reach it.
    environment:
      name: pypi
      url: https://pypi.org/project/flexi/${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@v7

      - name: Upload
        # --check-url makes a re-run of an interrupted upload a no-op rather
        # than a 400 from PyPI.
        run: |
          uv publish --trusted-publishing always \
            --check-url "https://pypi.org/simple/${PACKAGE}/" dist/*

  tag:
    name: Tag the release
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes
