name: Release PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepared:
    name: Release prepared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Title, version, release notes and screenshots agree
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          python scripts/release_pr.py check --root . --pr "$PR_NUMBER"
          --head "$RELEASE_HEAD" --title "$RELEASE_TITLE"
