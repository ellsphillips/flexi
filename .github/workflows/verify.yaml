name: Verify

# The one definition of what "green" means. `ci.yaml` calls it on every push and
# pull request; `release.yaml` calls the same thing before it publishes.
#
# Written once because it was written twice. The wheel probe used to exist in
# both files with two different hand-written dependency lists, and both fell
# behind pytest's `addopts` without anybody noticing -- one broke CI, and the
# other would have stopped the next release at the artefact check. A release is
# now verified by exactly what a pull request is verified by, because it is the
# same file.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --dev

      - name: uv.lock matches pyproject
        run: uv lock --check

      - name: ruff
        run: uv run ruff check --output-format=github

      - name: ruff format
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }} · TZ ${{ matrix.tz }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Windows is deliberately absent: Flexi stores its data under the XDG
        # base directories and has no Windows path story yet. Claiming it in a
        # matrix that never imports the package is how the last one passed for
        # a year while the app could not have started.
        os: [ubuntu-latest, macos-latest]
        # 3.14 is here because `requires-python = ">=3.12"` already serves it to
        # anybody who has it. Adding it found a real break: every SQLAlchemy
        # below 2.0.41 raises TypeError building a mapping on 3.14, so the
        # floor in pyproject is what makes this row honest.
        python: ["3.12", "3.13", "3.14"]
        # A timesheet's arithmetic must not move with the machine. Europe/London
        # is the one that matters -- it is the audience, and it is the only one
        # here with transitions.
        tz: ["UTC", "Europe/London"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}

      - run: uv sync --locked --dev

      # Coverage instrumentation roughly doubles the CPU cost of a run, and on
      # the three-core macOS runner that lands as an extra ~3 minutes of wall
      # time. It is enforced once, on a canonical interpreter, rather than on
      # all twelve jobs. The rest run the same tests without it, purely to
      # catch failures.
      - name: pytest with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.tz == 'UTC'
        env:
          TZ: ${{ matrix.tz }}
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: pytest
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.tz == 'UTC') }}
        env:
          TZ: ${{ matrix.tz }}
        run: uv run pytest

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.tz == 'UTC'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  late:
    name: Deferred callbacks land late
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --dev

      # Two tests once failed only on CI, in different files, because work a
      # layout had deferred landed on top of what they had just set up -- which
      # happens on a loaded three-core runner and not on a developer's laptop.
      # This puts every deferred callback behind a timer, so that ordering is
      # reproduced on purpose rather than waited for. `docs/TESTING.md` covers
      # running it locally, which takes twenty seconds.
      - name: pytest, with the screen finishing late
        env:
          TZ: UTC
          FLEXI_LATE_CALLBACKS: "0.05"
        run: uv run pytest

  wheel:
    name: The built wheel installs and runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv build

      - name: Install it somewhere that has no source tree
        run: |
          uv venv /tmp/probe
          # The wheel brings the runtime dependencies and is the only copy of
          # flexi on the path -- no editable install, no src/ on sys.path. The
          # dev group brings the test toolchain, taken from pyproject rather
          # than named here: a hand-picked list of plugins has to be kept in
          # step with `addopts` by hand, and the day `-n auto --timeout=120`
          # was added for the matrix this job started failing on an
          # unrecognised argument, saying nothing at all about the wheel.
          uv pip install --python /tmp/probe/bin/python dist/*.whl --group dev

      - name: Its data files travelled with it
        # Run against the installed package, not the checkout: a wheel missing
        # its stylesheets imports cleanly and then dies on the first frame.
        run: /tmp/probe/bin/python -m pytest tests/test_packaging.py -q

      - name: It migrates a database and paints a screen
        run: /tmp/probe/bin/python scripts/smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
