name: Verify

# The one definition of what "green" means. `ci.yaml` calls it on every push and
# pull request; `release.yaml` calls the same thing before it publishes.
#
# Written once because it was written twice. The wheel probe used to exist in
# both files with two different hand-written dependency lists, and both fell
# behind pytest's `addopts` without anybody noticing -- one broke CI, and the
# other would have stopped the next release at the artefact check. A release is
# now verified by exactly what a pull request is verified by, because it is the
# same file.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --dev

      - name: uv.lock matches pyproject
        run: uv lock --check

      - name: ruff
        run: uv run ruff check --output-format=github

      - name: ruff format
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }} · TZ ${{ matrix.tz }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Windows is here now. It was absent because the data directory had no
        # Windows story and the prompts refused to run without termios; both
        # are answered, and `%LOCALAPPDATA%` is no more a claim than
        # `~/.local/share` is until a job proves it.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14 is here because `requires-python = ">=3.12"` already serves it to
        # anybody who has it. Adding it found a real break: every SQLAlchemy
        # below 2.0.41 raises TypeError building a mapping on 3.14, so the
        # floor in pyproject is what makes this row honest.
        python: ["3.12", "3.13", "3.14"]
        # A timesheet's arithmetic must not move with the machine. Europe/London
        # is the one that matters -- it is the audience, and it is the only one
        # here with transitions.
        #
        # The suite pins its own clock through `flexi.wallclock`, so what this
        # row varies is the machine underneath it. Green in both is the evidence
        # that no reading escapes that pin; it used to export TZ and then have
        # `tests/conftest.py` overwrite it, so both rows ran the same suite.
        tz: ["UTC", "Europe/London"]
    steps:
      - uses: actions/checkout@v4

      # `TZ` is a POSIX idea. Windows keeps the zone in the registry and
      # `time.tzset` does not exist there, so setting the variable would leave
      # the runner on UTC while the job name said otherwise -- the matrix
      # claiming a dimension it had not varied.
      - name: Put the Windows runner in the row's timezone
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TZ: ${{ matrix.tz }}
        run: |
          $zone = if ($env:TZ -eq 'Europe/London') { 'GMT Standard Time' } else { 'UTC' }
          tzutil /s "$zone"
          Write-Host "runner clock: $(Get-Date -Format o)  ($(tzutil /g))"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}

      - run: uv sync --locked --dev

      # Coverage instrumentation roughly doubles the CPU cost of a run, and on
      # the three-core macOS runner that lands as an extra ~3 minutes of wall
      # time. It is enforced once, on a canonical interpreter, rather than on
      # all twelve jobs. The rest run the same tests without it, purely to
      # catch failures.
      - name: pytest with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.tz == 'UTC'
        env:
          TZ: ${{ matrix.tz }}
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: pytest
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.tz == 'UTC') }}
        env:
          TZ: ${{ matrix.tz }}
        run: uv run pytest

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && matrix.tz == 'UTC'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  late:
    name: Deferred callbacks land late
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --dev

      # Two tests once failed only on CI, in different files, because work a
      # layout had deferred landed on top of what they had just set up -- which
      # happens on a loaded three-core runner and not on a developer's laptop.
      # This puts every deferred callback behind a timer, so that ordering is
      # reproduced on purpose rather than waited for. `docs/TESTING.md` covers
      # running it locally, which takes twenty seconds.
      - name: pytest, with the screen finishing late
        env:
          TZ: UTC
          FLEXI_LATE_CALLBACKS: "0.05"
        run: uv run pytest

  wheel:
    name: The built wheel installs and runs · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The artefact is what a person downloads, and on Windows that is the
        # first moment anything checks that the data directory resolves, the
        # stylesheets are found by a path with backslashes in it, and the
        # application paints. The suite runs from a source tree and cannot say
        # any of that.
        os: [ubuntu-latest, windows-latest]
    env:
      # uv puts the interpreter under `bin` on POSIX and `Scripts` on Windows.
      # Relative, and inside the workspace: bash on Windows rewrites absolute
      # POSIX paths on the way to a native binary, and a venv the job cannot
      # name afterwards is a job that skips itself. A src layout is what keeps
      # this honest -- the checkout is the working directory and `flexi` is
      # still only importable from the wheel.
      PROBE: ${{ matrix.os == 'windows-latest' && '.probe/Scripts/python' || '.probe/bin/python' }}
    defaults:
      run:
        # bash on both, so the glob below is one command rather than two.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv build

      - name: Install it somewhere that has no source tree
        run: |
          uv venv .probe
          # The wheel brings the runtime dependencies and is the only copy of
          # flexi on the path -- no editable install, no src/ on sys.path. The
          # dev group brings the test toolchain, taken from pyproject rather
          # than named here: a hand-picked list of plugins has to be kept in
          # step with `addopts` by hand, and the day `-n auto --timeout=120`
          # was added for the matrix this job started failing on an
          # unrecognised argument, saying nothing at all about the wheel.
          uv pip install --python "$PROBE" dist/*.whl --group dev

      - name: Its data files travelled with it
        # Run against the installed package, not the checkout: a wheel missing
        # its stylesheets imports cleanly and then dies on the first frame.
        run: |
          "$PROBE" -m pytest tests/test_packaging.py -q

      - name: It migrates a database and paints a screen
        run: |
          "$PROBE" scripts/smoke.py

      - name: It knows where to keep the records on this machine
        # The one thing `smoke.py` cannot check, because it runs against a
        # temporary file: that the real data directory resolves somewhere
        # absolute and platform-appropriate. `%LOCALAPPDATA%` unset in a
        # service account, or an XDG variable inherited from a shell, both land
        # here rather than in somebody's first run.
        run: |
          "$PROBE" -c "
          from flexi.locations import config_file, database_file
          for path in (database_file(), config_file()):
              assert path.is_absolute(), path
              print(path)
          "

      - uses: actions/upload-artifact@v4
        # One copy. The wheel is pure Python and identical from either runner,
        # and `release.yaml` downloads this by name -- two uploads called `dist`
        # is an error, and the release would stop at the artefact check.
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: dist/
          if-no-files-found: error
