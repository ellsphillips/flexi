name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# PRs test the merge result once. Release tests main before publishing;
# workflow_dispatch covers a branch before its PR is opened.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Three concerns, three reusable workflows, and the same three called by
# `release.yaml`, so a release is verified by what a pull request is verified
# by. `tests/test_pipelines.py` asserts that the two lists stay the same.
#
# Separate files, so the job names read as `Static / …`, `Tests / …` and
# `Package / …` in the checks list.
jobs:
  static:
    name: Static
    uses: ./.github/workflows/static.yaml

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yaml

  package:
    name: Package
    uses: ./.github/workflows/package.yaml

  green:
    name: All green
    needs: [static, tests, package]
    # Report failures and skipped checks, but let a superseded run stop
    # immediately instead of queuing a final job after cancellation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The one check name the `dev` and `main` rulesets require. Matrix job
      # names carry their parameters ("macos-latest · Python 3.14 · TZ UTC"),
      # so requiring those by name means editing the ruleset for every new row.
      # This name never changes, and it fails if any row did.
      - name: Every check succeeded
        env:
          RESULTS: ${{ needs.static.result }} ${{ needs.tests.result }} ${{ needs.package.result }}
        run: |
          echo "Static, Tests, Package: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
