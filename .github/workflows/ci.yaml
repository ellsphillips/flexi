name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A new push to a branch makes the run before it irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yaml

  green:
    name: All green
    needs: verify
    # `always()`, so a skipped or cancelled Verify is reported rather than
    # quietly satisfying the gate by never running.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The one check name to require in the branch ruleset. The matrix job
      # names carry their own parameters -- "macos-latest · Python 3.14 · TZ
      # UTC" -- so requiring them by name means editing the ruleset every time
      # a row is added, and the ruleset silently protecting nothing until
      # somebody does. This name never changes, and it fails if any row did.
      - name: Every job in Verify succeeded
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          echo "Verify finished: $RESULT"
          test "$RESULT" = success
