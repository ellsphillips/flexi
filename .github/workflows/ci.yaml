name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the run before it irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked --dev

      - name: uv.lock matches pyproject
        run: uv lock --check

      - name: ruff
        run: uv run ruff check --output-format=github

      - name: ruff format
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is deliberately absent: Flexi stores its data under the XDG
        # base directories and has no Windows path story yet. Claiming it in a
        # matrix that never imports the package is how the last one passed for
        # a year while the app could not have started.
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python }}

      - run: uv sync --locked --dev

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  wheel:
    name: The built wheel installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv build

      - name: Install it somewhere that has no source tree
        run: |
          uv venv /tmp/probe
          uv pip install --python /tmp/probe/bin/python dist/*.whl pytest pytest-asyncio

      - name: Its data files travelled with it
        # Run against the installed package, not the checkout: a wheel missing
        # its stylesheets imports cleanly and then dies on the first frame.
        run: /tmp/probe/bin/python -m pytest tests/test_packaging.py -q

      - name: It migrates a database and paints a screen
        run: /tmp/probe/bin/python scripts/smoke.py

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
