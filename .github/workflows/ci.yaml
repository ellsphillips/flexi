name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A new push to a branch makes the run before it irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Three concerns, three reusable workflows, and the same three called by
# `release.yaml` -- which is what makes a release verified by exactly what a
# pull request is verified by. `tests/test_pipelines.py` asserts that the two
# lists stay the same, so the guarantee is enforced rather than remembered.
#
# They are separate files because they answer separate questions, and because
# the job names read as `Static / …`, `Tests / …` and `Package / …` in the
# checks list rather than twenty-two lines of `verify / …`.
jobs:
  static:
    name: Static
    uses: ./.github/workflows/static.yaml

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yaml

  package:
    name: Package
    uses: ./.github/workflows/package.yaml

  green:
    name: All green
    needs: [static, tests, package]
    # `always()`, so a skipped or cancelled check is reported rather than
    # quietly satisfying the gate by never running.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The one check name to require in the branch ruleset. The matrix job
      # names carry their own parameters -- "macos-latest · Python 3.14 · TZ
      # UTC" -- so requiring them by name means editing the ruleset every time
      # a row is added, and the ruleset silently protecting nothing until
      # somebody does. This name never changes, and it fails if any row did.
      - name: Every check succeeded
        env:
          RESULTS: ${{ needs.static.result }} ${{ needs.tests.result }} ${{ needs.package.result }}
        run: |
          echo "Static, Tests, Package: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
