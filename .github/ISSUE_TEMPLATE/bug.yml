name: Bug
description: Something Flexi does that it should not
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: screen
    attributes:
      label: What was on screen
      description: >
        Paste the terminal text, and say which screen you were on. Your screens
        show your hours, leave and sickness, so reproduce it with `flexi --demo`
        where you can, or remove personal details first.
      render: text

  - type: input
    id: version
    attributes:
      label: Version
      description: "`flexi --version`, and your terminal and OS."
      placeholder: "0.2.0 · kitty 0.32 · macOS 15.3"
    validations:
      required: true

  - type: checkboxes
    id: size
    attributes:
      label: Terminal size
      description: >
        Flexi lays out differently under 100 columns, again under 64, and on the
        dashboard under 38 rows.
      options:
        - label: I have said how wide and tall the terminal was, if the layout looks wrong
