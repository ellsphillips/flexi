name: Feature
description: Something Flexi should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The task, not the feature. "I need to see which Fridays I have already
        booked" leads somewhere better than "add a filter dropdown".
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: What you reach for now, and where that falls down.

  - type: input
    id: key
    attributes:
      label: Which key
      description: >
        If it wants a binding, say which. `docs/KEYMAP.md` has what is taken.
