version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    # uv.lock only. Without this Dependabot rewrites every floor in pyproject
    # to whatever it just locked, and a floor is meant to say the oldest
    # version the code runs on.
    versioning-strategy: lockfile-only
    groups:
      # One pull request a month, not fifteen. textual is the one pin worth
      # reading a diff for.
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["textual"]
