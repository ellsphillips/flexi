[project]
name = "flexi"
version = "0.1.0"
description = "A command line tool to help manage your time, flexibly."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["flexi", "time", "management"]
dependencies = [
    "alembic>=1.13.0",
    "click>=8.1.8",
    "httpx>=0.27.0",
    "pip>=24.3.1",
    "rich>=13.9.4",
    "sqlalchemy>=2.0.37",
    "textual>=8.2,<9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "plotext>=5.0,<6.0",
    "xdg-base-dirs>=6.0.2",
]

[project.scripts]
flexi = "flexi.__main__:cli"

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pre-commit>=4.0.1",
    "pygments>=2.19.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.1",
    "textual-dev>=1.7.0",
    "pytest-textual-snapshot>=1.1.0",
    "time-machine>=2.16.0",
    "types-pyyaml>=6.0",
    "typing-extensions>=4.12.2",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
# `auto` so a Pilot test is just an `async def`. With the decorator, the one
# somebody forgets is skipped silently rather than failed.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "src/flexi/domain"]
addopts = "--doctest-modules --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src/flexi"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.mypy]
strict = true
# src layout: without mypy_path every module is found twice, once as `flexi.x`
# and once as `src.flexi.x`, and mypy refuses to check either.
mypy_path = "src"
packages = ["flexi"]
exclude = "migrations|dist|build"
warn_unreachable = true
show_error_codes = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/flexi/migrations/versions"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The formatter owns these. Enabling them makes ruff argue with ruff-format.
    "COM812",
    "ISC001",
    # A docstring is earned, not mandatory. D2xx and D4xx still hold the ones
    # that exist to a standard.
    "D1",
    # Textual and Click hand back values that cannot be narrowed here.
    "ANN401",
    # Flexi deals in local civil time -- "what day is it where you are". An
    # aware UTC date answers a question nobody asked. domain/clock.py is the
    # only sanctioned reader of the system clock.
    "DTZ011",
    # Click and Textual both pass flags positionally.
    "FBT003",
    # The glyphs are the product: U+2212 in every delta, box drawing in the
    # calendar, half-blocks in the punch strips.
    "RUF001",
    "RUF002",
    "RUF003",
    # SQLAlchemy's declarative mapping and pydantic both resolve annotations at
    # runtime, so deferring an import is a NameError waiting for a release.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # asserts are the point
    "PLR2004", # a test says 7 because it means 7
    "INP001",  # the suite is not a package
    "SLF001",  # a test may reach past the front door
    "ARG",     # fixtures arrive as arguments and are not always read
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["flexi"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.format]
docstring-code-format = true
