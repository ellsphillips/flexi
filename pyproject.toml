[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flexi"
version = "0.1.0"
description = "A terminal application for tracking flexitime."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Elliott Phillips" }]
keywords = ["flexitime", "timesheet", "terminal", "tui", "textual", "time-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "alembic>=1.13.0",
    "click>=8.1.8",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.9.4",
    "sqlalchemy>=2.0.37",
    "textual>=8.2,<9",
]

[project.urls]
Homepage = "https://github.com/ellsphillips/flexi"
Documentation = "https://github.com/ellsphillips/flexi/tree/main/docs"
Repository = "https://github.com/ellsphillips/flexi"
Issues = "https://github.com/ellsphillips/flexi/issues"

[project.scripts]
flexi = "flexi.__main__:cli"

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pre-commit>=4.0.1",
    "pygments>=2.19.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.1",
    "textual-dev>=1.7.0",
    "pytest-textual-snapshot>=1.1.0",
    "time-machine>=2.16.0",
    "types-pyyaml>=6.0",
    "typing-extensions>=4.12.2",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.122",
    "pytest-randomly>=3.16",
    "pytest-timeout>=2.3",
]

[tool.hatch.build.targets.wheel]
# Everything under the package, not just the .py files: the app reads its
# stylesheets, py.typed and alembic templates from beside its own __file__.
packages = ["src/flexi"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "alembic.ini"]

[tool.uv]
package = true

[tool.pytest.ini_options]
# `auto` so a Pilot test is just an `async def`. With the decorator, the one
# somebody forgets is skipped silently rather than failed.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "src/flexi/domain", "src/flexi/cli/ui"]
addopts = "--doctest-modules --strict-markers --strict-config -n auto --timeout=120"

[tool.coverage.run]
branch = true
source = ["src/flexi"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.mypy]
strict = true
# src layout: without mypy_path every module is found twice, once as `flexi.x`
# and once as `src.flexi.x`, and mypy refuses to check either.
mypy_path = "src"
files = ["src/flexi", "tests"]
exclude = "migrations|dist|build"
warn_unreachable = true
show_error_codes = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/flexi/migrations/versions"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The formatter owns these. Enabling them makes ruff argue with ruff-format.
    "COM812",
    "ISC001",
    # A docstring is earned, not mandatory. D2xx and D4xx still hold the ones
    # that exist to a standard.
    "D1",
    # Textual and Click hand back values that cannot be narrowed here.
    "ANN401",
    # Flexi records local civil time: a timesheet is written in the wall time
    # the person lives in. DTZ005 and DTZ011 stay on, so the only way to read
    # the system clock remains flexi/wallclock.py.
    "DTZ001",
    # Click and Textual both pass flags positionally.
    "FBT003",
    # The glyphs are the product: U+2212 in every delta, box drawing in the
    # calendar, half-blocks in the punch strips.
    "RUF001",
    "RUF002",
    "RUF003",
    # SQLAlchemy's declarative mapping and pydantic both resolve annotations at
    # runtime, so deferring an import is a NameError waiting for a release.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # asserts are the point
    "PLR2004", # a test says 7 because it means 7
    "INP001",  # the suite is not a package
    "SLF001",  # a test may reach past the front door
    "ARG",     # fixtures arrive as arguments and are not always read
    "FBT",     # parametrised booleans are data, not an API being designed
]
# Alembic owns this layout and looks the directory up by path, not by import.
"src/flexi/migrations/*" = ["INP001"]
# Developer scripts, run by path rather than imported.
"scripts/*" = ["INP001", "T201"]

[tool.ruff.lint.pylint]
# _verdict is one decision with seven named outcomes. Splitting it to satisfy a
# counter would put the ordering of those outcomes in two places.
max-returns = 8
# The wide signatures in this codebase are keyword-only by construction, so
# their call sites read as prose rather than as a row of unlabelled values.
# FBT and the keyword-only style carry what the arity limit is reaching for.
max-args = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["flexi"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.format]
docstring-code-format = true
