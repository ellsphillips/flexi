[alembic]
script_location = src/flexi/migrations
# No database. Flexi migrates its own when it starts, handing `env.py` the
# engine it already has. A URL here is a second answer to where the database
# is, and the answer it gave was a relative `flexi.db`: whatever directory
# `alembic` was run from. Name one to run a migration by hand:
# `alembic -x db=/tmp/scratch.db upgrade head`.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
