# Every check here runs the command CI runs, through the project environment.
# `--frozen` keeps it CI's environment: plain `uv run` re-resolves and rewrites
# uv.lock when pyproject has changed, and then the lint hook fails for the
# lockfile's reasons.
#
#   uv run pre-commit install
#
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict # macOS and Linux disagree; CI runs both
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^docs/shots/
      - id: mixed-line-ending
      - id: trailing-whitespace
        # Generated terminal captures. The trailing spaces are the padding that
        # makes a row the width it was drawn at, and shoot.py puts them back.
        exclude: ^docs/shots/

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        # No filenames: mypy resolves imports across the whole package, and
        # checking one file at a time invents errors that are not there.
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy-win32
        name: mypy (Windows view)
        # The ctypes lease and the msvcrt prompt are behind `sys.platform`
        # checks, so the pass above analyses neither.
        entry: uv run --frozen mypy --platform win32 --no-warn-unreachable
        language: system
        types: [python]
        pass_filenames: false

      - id: uv-lock
        name: uv.lock matches pyproject
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
